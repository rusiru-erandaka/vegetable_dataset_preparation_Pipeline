
name: Update CBSL Price Dataset

on:
  schedule:
    - cron: "30 2 * * 1-5"

  
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "latest"
        type: choice
        options:
          - latest      
          - backfill    
          - force       
      max_pages:
        description: "Max pages to scrape (backfill only, leave blank for all)"
        required: false
        default: ""

jobs:
  update:
    name: Extract prices and push to Hugging Face
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   

    
      - name: Set up Java 17 (for tabula-py)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      
      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: data/
          key: price-dataset-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-dataset-${{ runner.os }}-

      
      - name: Run update_dataset.py
        env:
          
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          MODE="${{ github.event.inputs.mode || 'latest' }}"
          MAX_PAGES="${{ github.event.inputs.max_pages }}"

          ARGS=""
          if [ "$MODE" = "backfill" ]; then
            ARGS="--backfill"
            if [ -n "$MAX_PAGES" ]; then
              ARGS="$ARGS --max-pages $MAX_PAGES"
            fi
          elif [ "$MODE" = "force" ]; then
            ARGS="--force"
          fi
          # "latest" mode → no extra args (default script behaviour)

          echo "Running: python update_dataset.py $ARGS"
          python scripts/update_dataset.py $ARGS

      
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        if: always()   # Upload even if a previous step soft-failed
        with:
          name: price-dataset-${{ github.run_id }}
          path: data/price_dataset.csv
          retention-days: 30

      
      - name: Check exit status
        if: failure()
        run: |
          echo "::error::update_dataset.py failed. Check the logs above for parser errors or network issues."