# .github/workflows/update_dataset.yml
#
# Runs every weekday at 8:00 AM Sri Lanka time (02:30 UTC) and can also be
# triggered manually from the GitHub Actions UI (latest / backfill / force).

name: Update CBSL Price Dataset

on:
  schedule:
    # minute hour day month weekday (UTC). 02:30 UTC = 08:00 AM Sri Lanka time.
    - cron: "30 2 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "latest"
        type: choice
        options:
          - latest      # Only process the most recent PDF (default daily mode)
          - backfill    # Probe and process all missing weekday URLs since history start
          - force       # Re-process latest even if date already exists
      start_date:
        description: "Backfill start date YYYY-MM-DD (backfill mode only, leave blank for full history)"
        required: false
        default: ""

jobs:
  update:
    name: Extract prices and push to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a full backfill probes ~900 URLs; don't let a hang burn runner time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # (Java removed: the script uses pdfplumber only, tabula-py is not needed.)
      # requirements.txt: pdfplumber, pandas, requests, huggingface_hub, python-dotenv

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cached CSV from the previous run. If the cache is evicted, the script
      # now restores the last published CSV from Hugging Face automatically.
      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: data/
          key: price-dataset-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-dataset-${{ runner.os }}-

      - name: Run update_dataset.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          MODE="${{ github.event.inputs.mode || 'latest' }}"
          START_DATE="${{ github.event.inputs.start_date }}"

          ARGS=""
          if [ "$MODE" = "backfill" ]; then
            ARGS="--backfill"
            if [ -n "$START_DATE" ]; then
              ARGS="$ARGS --start-date $START_DATE"
            fi
          elif [ "$MODE" = "force" ]; then
            ARGS="--force"
          fi

          echo "Running: python scripts/update_dataset.py $ARGS"
          python scripts/update_dataset.py $ARGS

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-dataset-${{ github.run_id }}
          path: data/price_dataset.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Check exit status
        if: failure()
        run: |
          echo "::error::update_dataset.py failed. Check the logs above for parser errors or network issues."
